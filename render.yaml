# Render blueprint: one web service (API + built UI) and one Postgres.
databases:
  - name: foreman-db
    plan: free
services:
  - type: web
    name: foreman
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: foreman-db, property: connectionString } }
      - { key: DATABASE_SSL, value: "true" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: NODE_ENV, value: production }
